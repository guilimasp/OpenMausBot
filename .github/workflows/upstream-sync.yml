# Daily sync with milind-soni/OpenMausBot.
#
# Branch model of this fork:
#   - `main`   is a pure mirror of upstream main — never commit to it
#   - `hermes` carries our own files rebased on top of main; the app is
#     always built from `hermes`
#
# The rule is that the newest upstream version always wins: a local change
# that gets in the way is dropped and reported, never allowed to hold the
# branch back. The only thing that stops a sync from being published is
# upstream failing its own typecheck and tests, because shipping a build
# that does not run is worse than being a day behind.
name: Upstream sync
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch: {}
permissions:
  contents: write
  issues: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      # GITHUB_TOKEN is refused any push that adds or changes a file under
      # .github/workflows/. No `permissions:` key grants it — only a PAT with
      # `workflow` scope can. So the day upstream edits one of its own
      # workflow files, the mirror is rejected and the fork silently stops
      # tracking upstream: that is what stalled this one on 0.1.14 while
      # upstream shipped 0.1.24.
      #
      # Workflow files never reach the app, so the fallback is to keep ours.
      # The retry pushes a tree whose .github/workflows/ is unchanged, which
      # the token is allowed to do. Set the SYNC_TOKEN secret to a PAT with
      # `workflow` scope to mirror those files too.
      - name: Use a PAT for pushes, if one is configured
        env:
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          [ -n "${SYNC_TOKEN:-}" ] || exit 0
          git remote set-url origin \
            "https://x-access-token:$SYNC_TOKEN@github.com/$GITHUB_REPOSITORY.git"
      - name: Mirror main from upstream
        run: |
          git config user.name "upstream-sync[bot]"
          git config user.email "actions@users.noreply.github.com"
          git remote add upstream https://github.com/milind-soni/OpenMausBot.git
          git fetch upstream main
          # main is a pure mirror and upstream rewrites its history
          # (amends and rebases land most days), so mirror by reset rather
          # than merge — a fast-forward would fail on every rewrite
          git reset --hard upstream/main
          if git push --force origin main; then exit 0; fi
          echo "Kept the fork's .github/workflows/ — the token may not push upstream's." \
            >> "$GITHUB_STEP_SUMMARY"
          git fetch origin main
          git rm -rq --ignore-unmatch .github/workflows
          git checkout FETCH_HEAD -- .github/workflows
          git commit -q -m "Keep the fork's workflow files (the sync token cannot push upstream's)"
          git push --force origin main
      - name: Rebase hermes onto main
        id: rebase
        run: |
          git config user.name "upstream-sync[bot]"
          git config user.email "actions@users.noreply.github.com"
          git fetch origin hermes
          git checkout -B hermes origin/hermes
          # Upstream always wins. Three attempts, in order:
          #   1. plain rebase — also drops our copies of commits upstream
          #      merged or rewrote, since the patch-id matches
          #   2. rebase preferring upstream on conflicting hunks, so a local
          #      edit to a file upstream also changed is discarded rather
          #      than stalling the branch
          #   3. rebuild the branch from upstream plus our own files only
          # Whatever we lose is reported; being behind upstream is not an
          # option, because that is what silently stops the app updating.
          if git rebase main; then
            echo "rebased=clean" >> "$GITHUB_OUTPUT"
          else
            git rebase --abort || true
            if git rebase -X ours main; then
              echo "rebased=upstream-preferred" >> "$GITHUB_OUTPUT"
            else
              git rebase --abort || true
              git reset --hard main
              # our additions live in files upstream does not have, so they
              # replay cleanly from the previous tip
              git checkout origin/hermes -- .github/workflows/upstream-sync.yml scripts/ || true
              git add -A
              git commit -q -m "Fork tooling on top of upstream (local edits dropped by sync)" || true
              echo "rebased=rebuilt" >> "$GITHUB_OUTPUT"
            fi
          fi
      # The repo's CI only runs on main and pull requests, so the rebased
      # branch is verified here: a sync that breaks our driver must not be
      # pushed silently.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Verify the rebased branch
        id: verify
        run: |
          pnpm install --frozen-lockfile
          pnpm typecheck
          pnpm test
      - name: Push hermes
        if: steps.verify.outcome == 'success'
        # Same restriction as the mirror above. --force-with-lease is dropped
        # on the retry: the lease was already checked by the attempt that
        # failed on the workflow file, not on a concurrent write.
        run: |
          if git push --force-with-lease origin hermes; then exit 0; fi
          git fetch origin hermes
          git rm -rq --ignore-unmatch .github/workflows
          git checkout FETCH_HEAD -- .github/workflows
          git commit -q -m "Keep the fork's workflow files (the sync token cannot push upstream's)"
          git push --force origin hermes
      # Losing a local edit is fine, but it must never happen silently.
      - name: Report a sync that dropped something or failed
        if: always() && (failure() || steps.rebase.outputs.rebased != 'clean')
        env:
          GH_TOKEN: ${{ github.token }}
          MODE: ${{ steps.rebase.outputs.rebased }}
          VERIFY: ${{ steps.verify.outcome }}
        # A report that cannot be delivered (issues turned off on the fork,
        # for one) is a lost notification, not a failed sync — the summary
        # is written either way, and the step never fails the run.
        continue-on-error: true
        run: |
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" \
            --search "Upstream sync needs attention in:title" --state open --json number --jq length 2>/dev/null || echo 0)
          if [ "$existing" != "0" ]; then exit 0; fi
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          case "$MODE" in
            upstream-preferred)
              body="Upstream changed files this branch had also changed. The sync kept upstream's version of the conflicting hunks, so \`hermes\` is current — but a local edit was dropped. Check the diff against \`main\` and re-apply anything still wanted: $run_url" ;;
            rebuilt)
              body="The rebase could not be resolved, so \`hermes\` was rebuilt from upstream plus this fork's own files (\`scripts/\` and the sync workflow). Any other local change is gone from the branch and lives only in the reflog of the previous tip: $run_url" ;;
            *)
              body="The sync rebased \`hermes\` onto the new upstream \`main\`, but typecheck or tests failed (\`$VERIFY\`), so nothing was pushed — the app keeps running the last good build. Upstream likely broke something: $run_url" ;;
          esac
          echo "$body" >> "$GITHUB_STEP_SUMMARY"
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "Upstream sync needs attention" --body "$body"
